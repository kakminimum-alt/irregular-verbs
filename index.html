<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Irregular Verbs Trainer</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--ok:#15803d;--bad:#b91c1c;--border:#e5e7eb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:980px;margin:auto;padding:24px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 8px 30px #0000000a}h1{margin:0 0 8px}.muted,.small{color:var(--muted)}.top,.toolbar,.stats,.choices{display:flex;gap:10px;flex-wrap:wrap}.top{margin:18px 0}button,select,input{font:inherit;border-radius:12px;border:1px solid var(--border);padding:11px 13px;background:#fff}button{cursor:pointer;background:#111827;color:#fff;border-color:#111827}.secondary{background:#fff;color:var(--text)}.danger{background:#fff;color:var(--bad);border-color:#fecaca}.task{font-size:20px;margin:18px 0}.prompt{font-size:34px;font-weight:800;margin:8px 0 16px}.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}.field input{width:100%}.choice{background:#fff;color:var(--text)}.choice.selected{outline:3px solid #9ca3af}.result{padding:12px 14px;border-radius:12px;margin-top:14px;display:none;white-space:pre-line}.result.ok{display:block;background:#dcfce7;color:var(--ok)}.result.bad{display:block;background:#fee2e2;color:var(--bad)}.result.info{display:block;background:#fef3c7;color:#92400e}.stats{margin-top:14px;font-size:14px;color:var(--muted)}details{margin-top:18px;border-top:1px solid var(--border);padding-top:14px}summary{cursor:pointer;font-weight:700}.toolbar{align-items:center;margin:14px 0}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:auto 16px 1fr;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:12px}.row input{width:18px;height:18px}.forms{font-weight:650}.ru{color:var(--muted);font-size:14px}.light{width:12px;height:12px;border-radius:50%;background:#d1d5db}.green{background:#22c55e}.yellow{background:#eab308}.red{background:#ef4444}@media(max-width:640px){.wrap{padding:12px}.card{padding:16px}.top>*,.top select{width:100%}.prompt{font-size:29px}}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>Irregular Verbs Trainer</h1><div class="muted">Тренажёр неправильных глаголов: формы, перевод и повторение ошибок.</div>
<div class="top"><select id="mode"><option value="mixed">Смешанный режим</option><option value="ruToForms">Русский → 3 формы</option><option value="v1ToV2V3">V1 → V2 + V3</option><option value="v1ToTranslation">V1 → перевод</option><option value="translationToV3">Русский → только V3</option><option value="chooseV2">Выбрать V2</option><option value="chooseV3">Выбрать V3</option></select><button id="check">Проверить</button><button id="next" class="secondary">Следующий</button><button id="mistakes" class="secondary">Повторять ошибки</button><button id="resetSession" class="secondary">Сбросить занятие</button></div>
<div class="task" id="task"></div><div class="prompt" id="prompt"></div><div class="answers" id="answers"></div><div class="choices" id="choices"></div><div class="result" id="result"></div>
<div class="stats"><span>Правильно: <b id="ok">0</b></span><span>Ошибки: <b id="bad">0</b></span><span>Выбрано: <b id="selectedCount">0</b></span><span>В тренировке: <b id="poolCount">0</b></span></div>
<details><summary>Выбрать глаголы для изучения</summary><div class="toolbar"><button id="all" class="secondary">Выбрать все</button><button id="none" class="secondary">Снять все</button><button id="resetStats" class="danger">Сбросить статистику</button><span class="small">Зелёный — хорошо, жёлтый — нестабильно, красный — много ошибок, серый — нет данных.</span></div><div class="list" id="list"></div></details>
</div></div>
<script>
const verbs=[
['take','took','taken','брать'],['teach','taught','taught','учить, преподавать'],['tell','told','told','рассказывать, говорить'],['think','thought','thought','думать'],['throw','threw','thrown','бросать'],['understand','understood','understood','понимать'],['wake','woke','woken','просыпаться, будить'],['wear','wore','worn','носить'],['win','won','won','выигрывать'],['write','wrote','written','писать'],
['shine','shone','shone','светить'],['shut','shut','shut','захлопывать, закрывать'],['sing','sang','sung','петь'],['sit','sat','sat','сидеть'],['sleep','slept','slept','спать'],['smell','smelt','smelt','пахнуть, нюхать'],['speak','spoke','spoken','говорить'],['spend','spent','spent','проводить время, тратить деньги'],['stand','stood','stood','стоять'],['steal','stole','stolen','красть'],['swim','swam','swum','плавать']
].map(([v1,v2,v3,ru])=>({v1,v2,v3,ru}));
const $=id=>document.getElementById(id),norm=s=>(s||'').trim().toLowerCase().replace(/ё/g,'е').replace(/[()]/g,'').replace(/\s+/g,' '),modes=['ruToForms','v1ToV2V3','v1ToTranslation','translationToV3','chooseV2','chooseV3'],SSEL='iv-selected-v2',SST='iv-stats-v2';
let selected=new Set(JSON.parse(localStorage.getItem(SSEL)||'null')||verbs.map(v=>v.v1)),stats=JSON.parse(localStorage.getItem(SST)||'{}'),current=null,currentMode='',choice=null,errors=[],onlyErrors=false,ok=0,bad=0;
const save=()=>{localStorage.setItem(SSEL,JSON.stringify([...selected]));localStorage.setItem(SST,JSON.stringify(stats))},chosen=()=>verbs.filter(v=>selected.has(v.v1)),pool=()=>onlyErrors?chosen().filter(v=>errors.some(e=>e.v1===v.v1)):chosen(),rnd=a=>a[Math.floor(Math.random()*a.length)],st=v=>stats[v]||{c:0,w:0};
function color(v){const s=st(v),t=s.c+s.w;if(!t)return'';const r=s.c/t;if(t>=3&&r>=.8)return'green';if(r>=.5)return'yellow';return'red'}
function renderList(){$('list').innerHTML='';verbs.forEach(v=>{const s=st(v.v1),t=s.c+s.w,row=document.createElement('label');row.className='row';row.innerHTML=`<input type="checkbox" ${selected.has(v.v1)?'checked':''}><span class="light ${color(v.v1)}" title="Правильно: ${s.c}, ошибок: ${s.w}"></span><span><div class="forms">${v.v1} — ${v.v2} — ${v.v3}</div><div class="ru">${v.ru}${t?` · ${s.c} правильно / ${s.w} ошибок`:''}</div></span>`;row.querySelector('input').onchange=e=>{e.target.checked?selected.add(v.v1):selected.delete(v.v1);save();renderStats();newTask()};$('list').appendChild(row)})}
function inputs(arr){$('answers').innerHTML='';arr.forEach(x=>{const d=document.createElement('div');d.className='field';d.innerHTML=`<label>${x[1]}</label><input id="${x[0]}" autocomplete="off">`;$('answers').appendChild(d)});setTimeout(()=>{$('answers').querySelector('input')?.focus()},0)}
function choices(key){$('choices').innerHTML='';choice=null;let opts=[...new Set([current[key],...verbs.map(v=>v[key])])].sort(()=>Math.random()-.5).slice(0,5);if(!opts.includes(current[key]))opts[0]=current[key];opts.sort(()=>Math.random()-.5).forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>{choice=o;[...$('choices').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('choices').appendChild(b)})}
function info(t){$('result').className='result info';$('result').textContent=t}
function newTask(){$('result').className='result';$('result').textContent='';$('answers').innerHTML='';$('choices').innerHTML='';const p=pool();if(!p.length){current=null;$('task').textContent='';$('prompt').textContent='';info(onlyErrors?'Среди выбранных глаголов пока нет ошибок.':'Ни один глагол не выбран. Раскрой список ниже и поставь галочки.');renderStats();return}current=rnd(p);currentMode=$('mode').value==='mixed'?rnd(modes):$('mode').value;const T=$('task'),P=$('prompt');if(currentMode==='ruToForms'){T.textContent='Переведи на английский и напиши 3 формы:';P.textContent=current.ru;inputs([['v1','V1'],['v2','V2'],['v3','V3']])}if(currentMode==='v1ToV2V3'){T.textContent='Напиши вторую и третью форму:';P.textContent=current.v1;inputs([['v2','V2'],['v3','V3']])}if(currentMode==='v1ToTranslation'){T.textContent='Напиши перевод:';P.textContent=current.v1;inputs([['ru','Перевод на русский']])}if(currentMode==='translationToV3'){T.textContent='По русскому значению напиши третью форму:';P.textContent=current.ru;inputs([['v3','V3']])}if(currentMode==='chooseV2'){T.textContent='Выбери вторую форму:';P.textContent=current.v1;choices('v2')}if(currentMode==='chooseV3'){T.textContent='Выбери третью форму:';P.textContent=current.v1;choices('v3')}renderStats()}
function check(){if(!current)return;let good=true,miss=[];const field=(id,val)=>{const e=$(id);if(e&&norm(e.value)!==norm(val)){good=false;miss.push(`${id.toUpperCase()}: правильно — ${val}`)}};if(currentMode==='ruToForms'){field('v1',current.v1);field('v2',current.v2);field('v3',current.v3)}else if(currentMode==='v1ToV2V3'){field('v2',current.v2);field('v3',current.v3)}else if(currentMode==='v1ToTranslation'){const u=norm($('ru').value),accepted=current.ru.split(',').map(norm);if(!accepted.includes(u)&&u!==norm(current.ru)){good=false;miss.push(`Перевод: ${current.ru}`)}}else if(currentMode==='translationToV3')field('v3',current.v3);else if(currentMode==='chooseV2'&&choice!==current.v2){good=false;miss.push(`V2: ${current.v2}`)}else if(currentMode==='chooseV3'&&choice!==current.v3){good=false;miss.push(`V3: ${current.v3}`)}const s=st(current.v1);good?s.c++:s.w++;stats[current.v1]=s;save();if(good){ok++;errors=errors.filter(v=>v.v1!==current.v1);$('result').className='result ok';$('result').textContent=`Правильно ✅\n${current.v1} — ${current.v2} — ${current.v3} — ${current.ru}`}else{bad++;if(!errors.some(v=>v.v1===current.v1))errors.push(current);$('result').className='result bad';$('result').textContent=`Ошибка ❌\n${miss.join('\n')}\n\nПолностью: ${current.v1} — ${current.v2} — ${current.v3} — ${current.ru}`}renderList();renderStats()}
function renderStats(){$('ok').textContent=ok;$('bad').textContent=bad;$('selectedCount').textContent=chosen().length;$('poolCount').textContent=pool().length;$('mistakes').textContent=onlyErrors?'Вернуться ко всем':`Повторять ошибки (${errors.length})`}
$('check').onclick=check;$('next').onclick=newTask;$('mode').onchange=newTask;$('resetSession').onclick=()=>{ok=bad=0;errors=[];onlyErrors=false;newTask()};$('mistakes').onclick=()=>{if(!onlyErrors&&!errors.length){info('Ошибок пока нет.');return}onlyErrors=!onlyErrors;newTask()};$('all').onclick=()=>{selected=new Set(verbs.map(v=>v.v1));save();renderList();newTask()};$('none').onclick=()=>{selected.clear();save();renderList();newTask()};$('resetStats').onclick=()=>{if(confirm('Сбросить всю статистику?')){stats={};save();renderList()}};document.addEventListener('keydown',e=>{if(e.key==='Enter')($('result').classList.contains('ok')||$('result').classList.contains('bad'))?newTask():check()});renderList();newTask();
</script></body></html>
