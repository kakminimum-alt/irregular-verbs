<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Irregular Verbs Trainer</title>
  <style>
    :root { --bg:#f6f7fb; --card:#fff; --text:#111827; --muted:#6b7280; --ok:#15803d; --bad:#b91c1c; --border:#e5e7eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:var(--bg); color:var(--text); }
    .wrap { max-width: 920px; margin: 0 auto; padding: 24px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:18px; padding:22px; box-shadow:0 8px 30px rgba(0,0,0,.04); }
    h1 { margin:0 0 8px; font-size:28px; }
    .muted { color:var(--muted); }
    .top { display:flex; gap:12px; flex-wrap:wrap; margin:18px 0; }
    button, select, input { font:inherit; border-radius:12px; border:1px solid var(--border); padding:11px 13px; background:#fff; }
    button { cursor:pointer; background:#111827; color:#fff; border-color:#111827; }
    button.secondary { background:#fff; color:#111827; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .task { font-size:20px; line-height:1.45; margin:18px 0; }
    .prompt { font-size:34px; font-weight:800; margin:8px 0 16px; }
    .answerGrid { display:grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap:10px; margin:14px 0; }
    .field label { display:block; font-size:13px; color:var(--muted); margin-bottom:5px; }
    .field input { width:100%; }
    .choices { display:flex; flex-wrap:wrap; gap:10px; margin:14px 0; }
    .choice { background:#fff; color:#111827; border:1px solid var(--border); }
    .result { padding:12px 14px; border-radius:12px; margin-top:14px; display:none; white-space:pre-line; }
    .result.ok { display:block; background:#dcfce7; color:var(--ok); }
    .result.bad { display:block; background:#fee2e2; color:var(--bad); }
    .stats { display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; color:var(--muted); font-size:14px; }
    table { width:100%; border-collapse:collapse; margin-top:18px; font-size:14px; }
    th, td { border-bottom:1px solid var(--border); padding:8px; text-align:left; }
    details { margin-top:18px; }
    .small { font-size:13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Irregular Verbs Trainer</h1>
      <div class="muted">Тренажёр неправильных глаголов: формы, перевод, обратный перевод, выбор 2/3 формы.</div>

      <div class="top">
        <select id="mode">
          <option value="mixed">Смешанный режим</option>
          <option value="ruToForms">Русский → 3 формы</option>
          <option value="v1ToV2V3">V1 → V2 + V3</option>
          <option value="v1ToTranslation">V1 → перевод</option>
          <option value="translationToV3">Русский → только V3</option>
          <option value="chooseV2">Выбрать V2</option>
          <option value="chooseV3">Выбрать V3</option>
        </select>
        <button id="checkBtn">Проверить</button>
        <button id="nextBtn" class="secondary">Следующий</button>
        <button id="repeatMistakesBtn" class="secondary">Повторять ошибки</button>
        <button id="resetBtn" class="secondary">Сброс</button>
      </div>

      <div class="task" id="taskText"></div>
      <div class="prompt" id="promptText"></div>
      <div class="answerGrid" id="answerGrid"></div>
      <div class="choices" id="choices"></div>
      <div class="result" id="result"></div>

      <div class="stats">
        <div>Правильно: <b id="okCount">0</b></div>
        <div>Ошибки: <b id="badCount">0</b></div>
        <div>Сейчас в наборе: <b id="poolCount">0</b></div>
      </div>

      <details>
        <summary>Список глаголов</summary>
        <table id="verbsTable">
          <thead><tr><th>V1</th><th>V2</th><th>V3</th><th>Перевод</th></tr></thead>
          <tbody></tbody>
        </table>
      </details>
    </div>
  </div>

<script>
const verbs = [
  {v1:"take", v2:"took", v3:"taken", ru:"брать"},
  {v1:"teach", v2:"taught", v3:"taught", ru:"учить, преподавать"},
  {v1:"tell", v2:"told", v3:"told", ru:"рассказывать, говорить"},
  {v1:"think", v2:"thought", v3:"thought", ru:"думать"},
  {v1:"throw", v2:"threw", v3:"thrown", ru:"бросать"},
  {v1:"understand", v2:"understood", v3:"understood", ru:"понимать"},
  {v1:"wake", v2:"woke", v3:"woken", ru:"просыпаться, будить"},
  {v1:"wear", v2:"wore", v3:"worn", ru:"носить"},
  {v1:"win", v2:"won", v3:"won", ru:"выигрывать"},
  {v1:"write", v2:"wrote", v3:"written", ru:"писать"}
];

const modes = ["ruToForms","v1ToV2V3","v1ToTranslation","translationToV3","chooseV2","chooseV3"];
let current = null;
let currentMode = null;
let selectedChoice = null;
let mistakes = [];
let useMistakesOnly = false;
let ok = 0, bad = 0;

const $ = id => document.getElementById(id);
const norm = s => (s || "").trim().toLowerCase().replace(/[ё]/g,"е").replace(/\s+/g," ");
const splitRu = s => s.split(",").map(x => norm(x));

function randomItem(arr){ return arr[Math.floor(Math.random()*arr.length)] }
function pool(){ return useMistakesOnly && mistakes.length ? mistakes : verbs }

function setInputs(fields) {
  $("answerGrid").innerHTML = "";
  fields.forEach(f => {
    const div = document.createElement("div");
    div.className = "field";
    div.innerHTML = `<label>${f.label}</label><input id="${f.id}" autocomplete="off" />`;
    $("answerGrid").appendChild(div);
  });
  setTimeout(() => {
    const first = $("answerGrid").querySelector("input");
    if (first) first.focus();
  }, 0);
}

function setChoices(correctKey) {
  $("choices").innerHTML = "";
  selectedChoice = null;
  const correct = current[correctKey];
  const options = [...new Set([correct, ...verbs.map(v => v[correctKey])])]
    .sort(() => Math.random() - .5)
    .slice(0, Math.min(5, verbs.length));
  if (!options.includes(correct)) options[Math.floor(Math.random()*options.length)] = correct;
  options.sort(() => Math.random() - .5).forEach(opt => {
    const b = document.createElement("button");
    b.className = "choice";
    b.textContent = opt;
    b.onclick = () => {
      selectedChoice = opt;
      [...$("choices").children].forEach(x => x.style.outline = "");
      b.style.outline = "3px solid #9ca3af";
    };
    $("choices").appendChild(b);
  });
}

function newTask() {
  $("result").className = "result";
  $("result").textContent = "";
  $("choices").innerHTML = "";
  current = randomItem(pool());
  currentMode = $("mode").value === "mixed" ? randomItem(modes) : $("mode").value;

  const task = $("taskText");
  const prompt = $("promptText");

  if (currentMode === "ruToForms") {
    task.textContent = "Переведи на английский и напиши 3 формы:";
    prompt.textContent = current.ru;
    setInputs([{id:"v1",label:"V1"}, {id:"v2",label:"V2"}, {id:"v3",label:"V3"}]);
  }
  if (currentMode === "v1ToV2V3") {
    task.textContent = "Напиши вторую и третью форму:";
    prompt.textContent = current.v1;
    setInputs([{id:"v2",label:"V2"}, {id:"v3",label:"V3"}]);
  }
  if (currentMode === "v1ToTranslation") {
    task.textContent = "Напиши перевод:";
    prompt.textContent = current.v1;
    setInputs([{id:"ru",label:"Перевод на русский"}]);
  }
  if (currentMode === "translationToV3") {
    task.textContent = "По русскому значению напиши третью форму:";
    prompt.textContent = current.ru;
    setInputs([{id:"v3",label:"V3"}]);
  }
  if (currentMode === "chooseV2") {
    task.textContent = "Выбери вторую форму:";
    prompt.textContent = current.v1;
    setInputs([]);
    setChoices("v2");
  }
  if (currentMode === "chooseV3") {
    task.textContent = "Выбери третью форму:";
    prompt.textContent = current.v1;
    setInputs([]);
    setChoices("v3");
  }
  updateStats();
}

function isRuCorrect(input) {
  const user = norm(input);
  return splitRu(current.ru).some(x => user === x) || user === norm(current.ru);
}

function check() {
  let correct = true;
  const misses = [];

  function checkField(id, val) {
    const el = $(id);
    if (!el) return;
    if (norm(el.value) !== norm(val)) {
      correct = false;
      misses.push(`${id.toUpperCase()}: правильно — ${val}`);
    }
  }

  if (currentMode === "ruToForms") {
    checkField("v1", current.v1); checkField("v2", current.v2); checkField("v3", current.v3);
  } else if (currentMode === "v1ToV2V3") {
    checkField("v2", current.v2); checkField("v3", current.v3);
  } else if (currentMode === "v1ToTranslation") {
    const el = $("ru");
    if (!isRuCorrect(el.value)) { correct = false; misses.push(`Перевод: ${current.ru}`); }
  } else if (currentMode === "translationToV3") {
    checkField("v3", current.v3);
  } else if (currentMode === "chooseV2") {
    if (selectedChoice !== current.v2) { correct = false; misses.push(`V2: ${current.v2}`); }
  } else if (currentMode === "chooseV3") {
    if (selectedChoice !== current.v3) { correct = false; misses.push(`V3: ${current.v3}`); }
  }

  if (correct) {
    ok++;
    mistakes = mistakes.filter(v => v.v1 !== current.v1);
    $("result").className = "result ok";
    $("result").textContent = `Правильно ✅\n${current.v1} — ${current.v2} — ${current.v3} — ${current.ru}`;
  } else {
    bad++;
    if (!mistakes.some(v => v.v1 === current.v1)) mistakes.push(current);
    $("result").className = "result bad";
    $("result").textContent = `Ошибка ❌\n${misses.join("\n")}\n\nПолностью: ${current.v1} — ${current.v2} — ${current.v3} — ${current.ru}`;
  }
  updateStats();
}

function updateStats() {
  $("okCount").textContent = ok;
  $("badCount").textContent = bad;
  $("poolCount").textContent = pool().length;
  $("repeatMistakesBtn").textContent = useMistakesOnly ? "Вернуться ко всем" : `Повторять ошибки (${mistakes.length})`;
}

$("checkBtn").onclick = check;
$("nextBtn").onclick = newTask;
$("resetBtn").onclick = () => { ok=0; bad=0; mistakes=[]; useMistakesOnly=false; newTask(); };
$("repeatMistakesBtn").onclick = () => { useMistakesOnly = !useMistakesOnly; if (useMistakesOnly && !mistakes.length) useMistakesOnly=false; newTask(); };
$("mode").onchange = newTask;
document.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    if ($("result").className.includes("ok") || $("result").className.includes("bad")) newTask();
    else check();
  }
});

$("verbsTable").querySelector("tbody").innerHTML = verbs.map(v =>
  `<tr><td>${v.v1}</td><td>${v.v2}</td><td>${v.v3}</td><td>${v.ru}</td></tr>`
).join("");

newTask();
</script>
</body>
</html>
