<body><div class="wrap"><div class="card">

const $=id=>document.getElementById(id),norm=s=>(s||'').trim().toLowerCase().replace(/ё/g,'е').replace(/[()]/g,'').replace(/\s+/g,' '),modes=['ruToForms','v1ToV2V3','v1ToTranslation','translationToV3','chooseV2','chooseV3'],SSEL='iv-selected-v3',SST='iv-stats-v2';
let selected=new Set(JSON.parse(localStorage.getItem(SSEL)||'null')||verbs.map(v=>v.v1)),stats=JSON.parse(localStorage.getItem(SST)||'{}'),current=null,currentMode='',choice=null,errors=[],onlyErrors=false,ok=0,bad=0;
const save=()=>{localStorage.setItem(SSEL,JSON.stringify([...selected]));localStorage.setItem(SST,JSON.stringify(stats))},chosen=()=>verbs.filter(v=>selected.has(v.v1)),pool=()=>onlyErrors?chosen().filter(v=>errors.some(e=>e.v1===v.v1)):chosen(),rnd=a=>a[Math.floor(Math.random()*a.length)],st=v=>stats[v]||{c:0,w:0};
function color(v){const s=st(v),t=s.c+s.w;if(!t)return'';const r=s.c/t;if(t>=3&&r>=.8)return'green';if(r>=.5)return'yellow';return'red'}
function renderList(){$('list').innerHTML='';verbs.forEach(v=>{const s=st(v.v1),t=s.c+s.w,row=document.createElement('label');row.className='row';row.innerHTML=`<input type="checkbox" ${selected.has(v.v1)?'checked':''}><span class="light ${color(v.v1)}" title="Правильно: ${s.c}, ошибок: ${s.w}"></span><span><div class="forms">${v.v1} — ${v.v2} — ${v.v3}</div><div class="ru">${v.ru}${t?` · ${s.c} правильно / ${s.w} ошибок`:''}</div></span>`;row.querySelector('input').onchange=e=>{e.target.checked?selected.add(v.v1):selected.delete(v.v1);save();renderStats();newTask()};$('list').appendChild(row)})}
function inputs(arr){$('answers').innerHTML='';arr.forEach(x=>{const d=document.createElement('div');d.className='field';d.innerHTML=`<label>${x[1]}</label><input id="${x[0]}" autocomplete="off">`;$('answers').appendChild(d)});setTimeout(()=>{$('answers').querySelector('input')?.focus()},0)}
function choices(key){$('choices').innerHTML='';choice=null;const correctVariants=current[key].split('/');let opts=[...new Set([...correctVariants,...verbs.flatMap(v=>v[key].split('/'))])].sort(()=>Math.random()-.5).slice(0,5);if(!opts.some(x=>correctVariants.includes(x)))opts[0]=correctVariants[0];opts.sort(()=>Math.random()-.5).forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>{choice=o;[...$('choices').children].forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};$('choices').appendChild(b)})}
function info(t){$('result').className='result info';$('result').textContent=t}
function newTask(){$('result').className='result';$('result').textContent='';$('answers').innerHTML='';$('choices').innerHTML='';const p=pool();if(!p.length){current=null;$('task').textContent='';$('prompt').textContent='';info(onlyErrors?'Среди выбранных глаголов пока нет ошибок.':'Ни один глагол не выбран. Раскрой список ниже и поставь галочки.');renderStats();return}current=rnd(p);currentMode=$('mode').value==='mixed'?rnd(modes):$('mode').value;const T=$('task'),P=$('prompt');if(currentMode==='ruToForms'){T.textContent='Переведи на английский и напиши 3 формы:';P.textContent=current.ru;inputs([['v1','V1'],['v2','V2'],['v3','V3']])}if(currentMode==='v1ToV2V3'){T.textContent='Напиши вторую и третью форму:';P.textContent=current.v1;inputs([['v2','V2'],['v3','V3']])}if(currentMode==='v1ToTranslation'){T.textContent='Напиши перевод:';P.textContent=current.v1;inputs([['ru','Перевод на русский']])}if(currentMode==='translationToV3'){T.textContent='По русскому значению напиши третью форму:';P.textContent=current.ru;inputs([['v3','V3']])}if(currentMode==='chooseV2'){T.textContent='Выбери вторую форму:';P.textContent=current.v1;choices('v2')}if(currentMode==='chooseV3'){T.textContent='Выбери третью форму:';P.textContent=current.v1;choices('v3')}renderStats()}
function check(){if(!current)return;let good=true,miss=[];const field=(id,val)=>{const e=$(id),accepted=val.split('/').map(norm);if(e&&!accepted.includes(norm(e.value))){good=false;miss.push(`${id.toUpperCase()}: правильно — ${val}`)}};if(currentMode==='ruToForms'){field('v1',current.v1);field('v2',current.v2);field('v3',current.v3)}else if(currentMode==='v1ToV2V3'){field('v2',current.v2);field('v3',current.v3)}else if(currentMode==='v1ToTranslation'){const u=norm($('ru').value),accepted=current.ru.split(',').map(norm);if(!accepted.includes(u)&&u!==norm(current.ru)){good=false;miss.push(`Перевод: ${current.ru}`)}}else if(currentMode==='translationToV3')field('v3',current.v3);else if(currentMode==='chooseV2'&&!current.v2.split('/').map(norm).includes(norm(choice))){good=false;miss.push(`V2: ${current.v2}`)}else if(currentMode==='chooseV3'&&!current.v3.split('/').map(norm).includes(norm(choice))){good=false;miss.push(`V3: ${current.v3}`)}const s=st(current.v1);good?s.c++:s.w++;stats[current.v1]=s;save();if(good){ok++;errors=errors.filter(v=>v.v1!==current.v1);$('result').className='result ok';$('result').textContent=`Правильно ✅\n${current.v1} — ${current.v2} — ${current.v3} — ${current.ru}`}else{bad++;if(!errors.some(v=>v.v1===current.v1))errors.push(current);$('result').className='result bad';$('result').textContent=`Ошибка ❌\n${miss.join('\n')}\n\nПолностью: ${current.v1} — ${current.v2} — ${current.v3} — ${current.ru}`}renderList();renderStats()}
function renderStats(){$('ok').textContent=ok;$('bad').textContent=bad;$('selectedCount').textContent=chosen().length;$('poolCount').textContent=pool().length;$('mistakes').textContent=onlyErrors?'Вернуться ко всем':`Повторять ошибки (${errors.length})`}
$('check').onclick=check;$('next').onclick=newTask;$('mode').onchange=newTask;$('resetSession').onclick=()=>{ok=bad=0;errors=[];onlyErrors=false;newTask()};$('mistakes').onclick=()=>{if(!onlyErrors&&!errors.length){info('Ошибок пока нет.');return}onlyErrors=!onlyErrors;newTask()};$('all').onclick=()=>{selected=new Set(verbs.map(v=>v.v1));save();renderList();newTask()};$('none').onclick=()=>{selected.clear();save();renderList();newTask()};$('resetStats').onclick=()=>{if(confirm('Сбросить всю статистику?')){stats={};save();renderList()}};document.addEventListener('keydown',e=>{if(e.key==='Enter')($('result').classList.contains('ok')||$('result').classList.contains('bad'))?newTask():check()});renderList();newTask();
